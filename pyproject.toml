[project]
name = "hayate-documentation"
version = "0.1.0"
description = "Unified documentation for the Hayate Python ecosystem"
requires-python = ">=3.12"
dependencies = ["zensical==0.0.51"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
